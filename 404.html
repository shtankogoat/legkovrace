<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#14213a">
<title>Гонка Легкова 2027 — Сошли с трассы</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{--navy:#14213a;--red:#c40a1a;--red2:#e0142a}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--red) var(--navy)}
::selection{background:var(--red);color:#fff}
body{font-family:Manrope,sans-serif;background:var(--navy);color:#fff;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;position:relative}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
header{padding:22px clamp(16px,4vw,72px);position:relative;z-index:2}
header a{display:inline-flex;align-items:center;gap:12px;font-family:Unbounded;font-weight:700;font-size:17px;color:#fff;text-decoration:none}
header img{height:34px;filter:brightness(0) invert(1)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(16px,4vw,72px) 60px;position:relative;z-index:2}
.code{font-family:Unbounded;font-weight:900;font-size:clamp(120px,26vw,420px);line-height:.85;letter-spacing:-.05em;background:linear-gradient(180deg,#fff 35%,rgba(255,255,255,.05));-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.track{height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin:30px 0;position:relative;max-width:900px;overflow:hidden}
.track:after{content:"";position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--red);border-radius:6px;animation:run 2.4s cubic-bezier(.6,0,.4,1) infinite}
@keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
h1{font-family:Unbounded;font-weight:900;font-size:clamp(26px,4vw,52px);text-transform:uppercase;line-height:1.05}
p{opacity:.7;font-size:clamp(16px,1.5vw,20px);margin:16px 0 34px;max-width:560px}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;font-family:Unbounded;font-weight:700;font-size:14px;text-transform:uppercase;padding:18px 30px;border-radius:999px;text-decoration:none;transition:.25s}
.btn:hover{background:var(--red2);transform:translateY(-2px)}
.btn.g{background:transparent;border:2px solid rgba(255,255,255,.4)}
a,button{cursor:pointer}.btn.g:hover{border-color:#fff;background:transparent}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
main{align-items:center;text-align:center}
header{display:flex;justify-content:center}
.code{font-size:clamp(110px,18vw,260px)!important}
.track{width:min(420px,70%);margin:26px auto!important}
h1{font-size:clamp(22px,3vw,40px)!important}
p{margin-left:auto!important;margin-right:auto!important}
.btns{justify-content:center}
</style>
</head>
<body>
<canvas id="s"></canvas>
<header><a href="./" aria-label="Гонка Легкова 2027 — на главную"><img src="img/mark.svg" alt="">Гонка Легкова 2027</a></header>
<main>
 <div class="code" id="code">404</div>
 <div class="track"></div>
 <h1>Кажется, вы сошли с трассы</h1>
 <p id="msg">Такой страницы нет или она ещё в разработке. Возвращайтесь на основной сайт — старт уже скоро.</p>
 <div class="btns"><a class="btn" href="./">На главную →</a></div>
</main>
<script>
// same page handles 500/503 via ?code=
const M={500:['Падение на спуске','На сервере что-то пошло не так. Мы уже поднимаемся — попробуйте через минуту.'],503:['Трасса на подготовке','Идут технические работы. Скоро вернёмся на лыжню!'],403:['Вход только для участников','У вас нет доступа к этой странице.']};
const c=new URLSearchParams(location.search).get('code');
if(M[c]){code.textContent=c;document.querySelector('h1').textContent=M[c][0];msg.textContent=M[c][1];document.title='Гонка Легкова 2027 — '+M[c][0]}
const cv=document.getElementById('s'),x=cv.getContext('2d'),R=Math.min(devicePixelRatio||1,2);let F=[];
function mk(w,h,y){const z=Math.random();return{x:Math.random()*w,y,r:.6+z*z*2.6,s:.25+z*1.1,a:.2+z*.6,w:Math.random()*6}}
function rs(){const w=innerWidth,h=innerHeight;cv.width=w*R;cv.height=h*R;x.setTransform(R,0,0,R,0,0);F=Array.from({length:Math.round(w*h/12000)},()=>mk(w,h,Math.random()*h))}
rs();addEventListener('resize',rs);
(function a(){const w=innerWidth,h=innerHeight;x.clearRect(0,0,w,h);F.forEach((f,i)=>{f.y+=f.s;f.w+=.008;f.x+=Math.sin(f.w)*.35+.15;if(f.y>h+5)F[i]=mk(w,h,-5);x.fillStyle=`rgba(255,255,255,${f.a})`;x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill()});requestAnimationFrame(a)})();
</script>
</body>
</html>
